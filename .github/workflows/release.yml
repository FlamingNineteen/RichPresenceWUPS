name: Build on release

on:
  push:
    tags:
      - 'v*'
    # Pushing to the release branch publishes the version in wiiu/src/consts.hpp
    branches:
      - release
  workflow_dispatch:

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          cd wiiu
          docker build . -t builder
          docker run --rm -v ${PWD}:/project builder make
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: RichPresence.wps
          path: ./wiiu/*.wps
  build-client:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            cmd: --config Release
            path: /Release
            ext: .exe

          - name: Linux
            os: ubuntu-latest

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Linux Dependencies
        if: matrix.config.name == 'Linux'
        run: sudo apt-get update && sudo apt-get install libcurl4-openssl-dev
      

      - name: Build
        run: |
          cd discord
          mkdir build && cd build
          cmake ..
          cmake --build . ${{ matrix.config.cmd }}
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: WURP-${{ matrix.config.name }}${{ matrix.config.ext }}
          path: ./discord/build${{ matrix.config.path }}/WiiURichPresence*

  release:
    name: Publish release
    needs: [build-plugin, build-client]
    # Publish as long as the plugin built, even if a computer client failed
    if: always() && needs.build-plugin.result == 'success' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(sed -n 's/^#define VERSION "\(.*\)"/\1/p' wiiu/src/consts.hpp)" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect files
        run: |
          mkdir release
          find artifacts -type f -exec cp {} release/ \;
          cp setup/discord_setup.py release/
          ls -la release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: .github/release-notes.md
          files: release/*
